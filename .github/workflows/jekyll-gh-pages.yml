# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages published (with retries)
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying page at: $url"
          attempts=0
          max_attempts=3
          delay=5
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts+1))
            if curl -sf "$url" >/dev/null 2>&1; then
              echo "Pages are live (attempt=$attempts)"
              exit 0
            fi
            echo "Verification failed (attempt=$attempts). Sleeping $((delay * attempts))s before retry..."
            sleep $((delay * attempts))
          done
          echo "Pages verification failed after $max_attempts attempts" >&2
          exit 1
