name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy to Cloudflare Pages (with retry)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=3
          delay=5
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts+1))
            echo "Deploy attempt: $attempts"
            if npx wrangler pages deploy . --project-name=whaletrucker-reef; then
              echo "Deploy succeeded"
              break
            fi
            echo "Deploy failed (attempt=$attempts)."
            if [ "$attempts" -lt "$max_attempts" ]; then
              sleep $((delay * attempts))
              echo "Retrying..."
            else
              echo "All deploy attempts failed." >&2
              exit 1
            fi
          done
